name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Signed IPA export method (used only when signing secrets are configured)"
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc
          - app-store-connect

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Detect optional signing secrets
        id: signing
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=0
          for value in "$IOS_P12_BASE64" "$IOS_P12_PASSWORD" "$IOS_PROVISIONING_PROFILE_BASE64" "$IOS_TEAM_ID"; do
            if [[ -n "$value" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == "0" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [[ "$count" == "4" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Add all four signing secrets, or none of them." >&2
            exit 1
          fi

      - name: Build unsigned iOS app
        if: steps.signing.outputs.configured != 'true'
        run: >-
          xcodebuild
          -project LL3X-iOS/LL3X.xcodeproj
          -scheme LL3X
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned app
        if: steps.signing.outputs.configured != 'true'
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/LL3X.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/LL3X-unsigned-app.zip"

      - name: Upload unsigned app
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LL3X-unsigned-app
          path: ${{ runner.temp }}/LL3X-unsigned-app.zip
          if-no-files-found: error

      - name: Install signing certificate and provisioning profile
        if: steps.signing.outputs.configured == 'true'
        id: install-signing
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ll3x-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/ios-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist"

          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$P12_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Archive and export signed IPA
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.install-signing.outputs.profile_uuid }}
          EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
        run: |
          set -euo pipefail
          case "$EXPORT_METHOD" in
            development) SIGNING_IDENTITY="Apple Development" ;;
            ad-hoc|app-store-connect) SIGNING_IDENTITY="Apple Distribution" ;;
            *) echo "Unsupported export method: $EXPORT_METHOD" >&2; exit 1 ;;
          esac

          xcodebuild archive \
            -project LL3X-iOS/LL3X.xcodeproj \
            -scheme LL3X \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LL3X.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/LL3X.xcarchive/Products/Applications/LL3X.app/Info.plist")
          export BUNDLE_ID

          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LL3X.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LL3X-signed-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
